services:
  db:
    image: postgres:15-alpine
    container_name: novatrack_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: novatrack_db
    ports:
      - "5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: novatrack_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: